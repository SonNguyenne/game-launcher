services:
  bang-app:
    image: son29032001/game:${TAG:-latest}
    container_name: launcher-app
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8787}:8787"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
