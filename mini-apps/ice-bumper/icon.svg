<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="sky" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </radialGradient>
    <radialGradient id="ball" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </radialGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#sky)"/>
  <!-- Tảng băng nổi -->
  <ellipse cx="50" cy="62" rx="42" ry="24" fill="#0369a1"/>
  <ellipse cx="50" cy="58" rx="40" ry="22" fill="#ffffff"/>
  <!-- Quả cầu tuyết to tròn -->
  <circle cx="62" cy="50" r="20" fill="url(#ball)" stroke="#7dd3fc" stroke-width="1.5"/>
  <!-- Xe ủi đỏ mini -->
  <rect x="22" y="44" width="22" height="14" rx="3" fill="#ef4444"/>
  <rect x="18" y="54" width="28" height="6" rx="2" fill="#334155"/>
  <!-- Lưỡi ủi -->
  <polygon points="44,40 50,44 50,56 44,60" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
  <!-- Cánh cụt -->
  <circle cx="33" cy="42" r="6" fill="#0f172a"/>
  <circle cx="34" cy="42" r="4" fill="#ffffff"/>
  <polygon points="36,41 40,42 36,43" fill="#f59e0b"/>
</svg>
